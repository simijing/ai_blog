  <meta name="color-scheme" content="light">

  <meta name="author" content="pzx">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PZX 的博客">
  <meta property="og:description" content="记录技术，也记录思考。">
  <meta property="og:site_name" content="PZX 的博客">

  <!-- 内联 SVG 图标：不额外请求文件，浅色标签页也清晰 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1e36'/%3E%3Cpath d='M22 18h10a10 10 0 0 1 0 20h-6v8h-4z' fill='none' stroke='%2360a5fa' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/article.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>

  <!-- ===== 导航栏 ===== -->
  <header class="navbar" id="navbar">
    <div class="nav-container">

        <span class="nav-logo" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>
          </svg>
        </span>
        <a class="nav-brand-text" href="#/" aria-label="返回首页">
          <span class="nav-brand" id="navBrandName">PZX 的博客</span>
          <span class="nav-tagline" id="navTagline">记录技术、思考与生活</span>
        </a>
      </div>

      <nav class="nav-center" id="navMenu" aria-label="主导航">
        <a class="nav-link active" href="#/" data-nav="home">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          首页
        </a>
        <a class="nav-link" href="#/about" data-nav="about">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          关于
        </a>

        <!-- 移动端菜单里的搜索框 -->
        <div class="nav-mobile-search">
          <div class="nav-search">
            <input type="search" id="searchInputMobile" class="nav-search-input" placeholder="搜索文章…" aria-label="搜索文章" autocomplete="off">
            <button type="button" class="nav-search-clear" data-clear-search aria-label="清除搜索">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
            <svg class="nav-search-icon icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </div>
        </div>
      </nav>

      <div class="nav-actions">
        <div class="nav-search">
          <input type="search" id="searchInput" class="nav-search-input" placeholder="搜索文章…" aria-label="搜索文章" autocomplete="off">
          <button type="button" class="nav-search-clear" data-clear-search aria-label="清除搜索">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <svg class="nav-search-icon icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </div>

        <button type="button" class="nav-mobile-toggle" id="mobileToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="navMenu">
          <svg class="icon icon-menu" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== 主内容（由 js/app.js 按路由渲染） ===== -->
  <main class="main-content" id="mainContent" tabindex="-1">
    <div class="container" id="app">
      <noscript>
        <div class="error-state">
          <p class="empty-title">需要启用 JavaScript</p>
          <p class="empty-desc">本站是纯前端渲染的静态博客，请启用 JavaScript 后刷新页面。</p>
        </div>
      </noscript>
    </div>
  </main>

  <!-- ===== 页脚 ===== -->
  <footer class="footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>
          </svg>
          <span id="footerBrandName">PZX 的博客</span>
        </div>
        <p class="footer-desc" id="footerDesc">pzx 的个人博客：记录前端开发、AI 工具与日常思考，把值得留下的东西写下来。</p>

      <div class="footer-meta">

  <!-- ===== 回到顶部 ===== -->
  <button type="button" class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>

  <!-- ===== 脚本：顺序加载，无第三方依赖 ===== -->
  <script src="js/config.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
