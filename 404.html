<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面不存在 · PZX 的博客</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      background: #f7f7f5;
      color: #1f2328;
    }
    main {
      max-width: 480px;
      text-align: center;
    }
    .code {
      margin: 0;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #c9c9c4;
      line-height: 1;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 22px;
    }
    p {
      margin: 0 0 24px;
      color: #5b6068;
    }
    a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      background: #1f2328;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
    }
    a:hover {
      background: #3a3f46;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #16181c;
        color: #e6e6e3;
      }
      .code {
        color: #4a4f57;
      }
      p {
        color: #9aa0a8;
      }
      a {
        background: #e6e6e3;
        color: #16181c;
      }
      a:hover {
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>页面不存在</h1>
    <p>你访问的地址可能已被移动或输入有误。</p>
    <a id="home-link" href="/">返回首页</a>
  </main>
  <script>
    (function () {
      // 本项目使用 hash 路由。GitHub Pages 项目页部署在 /仓库名/ 子路径下，
      // 这里根据当前主机名推算站点根路径，保证「返回首页」链接正确。
      var segments = location.pathname.split("/").filter(Boolean);
      var isGithubPages = /\.github\.io$/i.test(location.hostname);
      var home = isGithubPages && segments.length ? "/" + segments[0] + "/" : "/";
      document.getElementById("home-link").href = home;
    })();
  </script>
</body>
</html>
